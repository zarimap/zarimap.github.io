
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zarimap - Crayfish Search Map</title>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<link href="../assets/css/style.css" rel="stylesheet"/>
<style>
        /* 地図の上にボタンを浮かせるためのスタイル */
        #map-container {
            position: relative;
            flex: 1; /* 親のmain-containerがFlexboxの場合、画面いっぱいに広げる */
            min-height: 400px; /* 必要に応じて調整 */
        }

        #map {
            height: 100%; /* containerいっぱいに広げる */
            width: 100%;
        }

        .map-floating-btn {
            position: absolute;
            bottom: 20px;   /* 下から20px */
            right: 20px;    /* 右から20px */
            z-index: 1000;  /* Leafletより手前に表示 */
            
            padding: 12px 20px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .map-floating-btn:hover {
            background-color: #d35400;
            transform: scale(1.05);
        }

        .map-floating-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
<header>
<div class="header-inner">
<h1>
<a href="../index.html" style="color: inherit; text-decoration: none;">
                    ザリマップ <span class="subtitle">ザリガニの目撃情報を共有</span>
</a>
</h1>
<nav class="header-nav">
<ul>
<li><a href="../index.html">ホーム</a></li>
<li><a href="details/post/">情報投稿</a></li>
<li><a href="https://sites.google.com/view/dzt/" rel="noopener noreferrer" target="_blank">公式サイト</a></li>
<li class="pc-only"><a href="https://github.com/zarimap/info/tree/main#english">About</a></li>
<li><a href="../ja/">日本語</a></li>
</ul>
</nav>
</div>
</header>
<div class="main-container">
<!-- 地図を浮かせるボタンと一緒にラップする -->
<div id="map-container">
<div id="map"></div>
<!-- マップ内に浮かせるボタン -->
<button class="map-floating-btn" id="locate-btn" type="button">
                🔍 近くのザリガニを探す
            </button>
</div>
<div id="data-panel">
<div id="info-content">
<h3>読み込み中...</h3>
<p>マップを動かして、近くの生息地を探してみましょう。</p>
</div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>const currentLang = 'en';</script>
<script src="../assets/js/map-logic.js"></script>
</body>
</html>
