Name: Build and Create Release Desktop Apps

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'リリース jak タグ名 (例: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'リリースタイトル (例: Release v1.0.0)'
        required: true
        default: 'Release v1.0.0'
      draft:
        description: '下書き（Draft）として作成するか'
        type: boolean
        default: false
      prerelease:
        description: 'プレリリース（Prerelease）とするか'
        type: boolean
        default: false

jobs:
  build:
    name: Build and Release for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    permissions:
      contents: write # 新しいReleaseやTagの作成・ファイル追加権限

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. ビルドの実行
      - name: Build Electron App
        run: npx electron-builder --${{ matrix.target }} --publish never

      # 2. 指定されたタグで新しいReleaseを作成し、成果物をアップロード
      # (複数のOSジョブから同時に同じReleaseに対してファイルが追記・結合されます)
      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*.zip
            dist/*.tar.gz
            dist/*.blockmap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
