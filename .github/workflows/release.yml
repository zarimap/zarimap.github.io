name: Build and Create Release Desktop Apps

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'リリース用タグ名 (既存と被らない値: 例 v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_name:
        description: 'リリースタイトル (例: Release v1.0.1)'
        required: true
        default: 'Release v1.0.1'
      draft:
        description: '下書き（Draft）として作成するか'
        type: boolean
        default: false
      prerelease:
        description: 'プレリリース（Prerelease）とするか'
        type: boolean
        default: false

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    permissions:
      contents: write # ReleaseやTagの作成・ファイル追加権限

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 1. Node.js のセットアップと npm キャッシュ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. 高速＆確定的な依存関係のインストール
      - name: Install dependencies
        run: npm ci

      # 3. アプリのビルド
      - name: Build Electron App
        run: npx electron-builder --${{ matrix.target }} --publish never

      # 4. Releaseの作成と成果物のアップロード (バージョン名が入ったファイルも網羅)
      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*.zip
            dist/*.tar.gz
            dist/*.blockmap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
