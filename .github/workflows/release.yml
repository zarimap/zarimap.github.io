name: Build and Release Desktop Apps

on:
  release:
    types: [published] # Web画面でPublishを押した時に発動

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    permissions:
      contents: write # Releaseへのファイル追加権限

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 1. ビルドのみ実行（勝手にReleaseを作らせないために --publish never を指定）
      - name: Build Electron App
        run: npx electron-builder --${{ matrix.target }} --publish never

      # 2. Web上で手動作成した「現在のRelease」にファイルを直接紐付けて追加
      - name: Upload Artifacts to Current Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
