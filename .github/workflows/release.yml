Name: Build and Release Desktop Apps

on:
  release:
    types: [published] # Web画面でPublishを押した時に発動

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 1つのOSでエラーが出ても他のOSの処理を継続する
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    permissions:
      contents: write # Releaseへのファイル追加権限

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # ビルド時間を短縮するためのキャッシュ

      - name: Install dependencies
        run: npm ci # npm install より CI 環境に適したコマンド

      # 1. ビルドのみ実行
      - name: Build Electron App
        run: npx electron-builder --${{ matrix.target }} --publish never

      # 2. 生成されたインストーラー・圧縮ファイルを自動検索してリリースに追加
      - name: Upload Artifacts to Current Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*.zip
            dist/*.tar.gz
            dist/*.blockmap
          fail_on_unmatched_files: false # 指定拡張子がなくてもエラーにしない
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
