    <script>
        // URLの ?id=0 を取得
        const urlParams = new URLSearchParams(window.location.search);
        const rawId = urlParams.get('id');
        const spotId = parseInt(rawId, 10);
        const targetId = isNaN(spotId) ? 0 : spotId;

        const loadingElem = document.getElementById('loading');

        // iPad用：画面上にログを出力するヘルパー関数
        function showOnScreenLog(msg) {
            loadingElem.innerHTML += `<br><span style="font-size:0.8rem; color:#666;">${msg}</span>`;
        }

        showOnScreenLog(`[1] リクエストされたID: ${targetId} (URL入力値: "${rawId}")`);

        // 最強化キャッシュバスター付きURL
        const csvUrl = `../../assets/data/zarigani.csv?cb=${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;

        fetch(csvUrl, {
            cache: 'no-cache',
            headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
        })
            .then(res => {
                if (!res.ok) throw new Error('CSVファイルが通信エラーです');
                return res.text();
            })
            .then(csvData => {
                // 改行コード（Windows / Mac）に対応して分割
                const rawRows = csvData.trim().split(/\r?\n/);
                showOnScreenLog(`[2] 読み込んだCSVの総行数: ${rawRows.length}行`);

                // ヘッダー除外 ＆ 空行削除
                const dataRows = rawRows.slice(1).filter(row => row.trim() !== '');
                showOnScreenLog(`[3] 有効なデータ件数: ${dataRows.length}件 (指定可能なID: 0 〜 ${dataRows.length - 1})`);

                // CSV行のパース
                const data = dataRows.map(row => row.split(',').map(cell => cell.trim()));

                if (data[targetId]) {
                    const target = data[targetId];
                    showOnScreenLog(`[4] ID ${targetId} のデータが見つかりました: "${target[0]}"`);

                    // HTML要素へ書き込み
                    document.getElementById('disp-name').innerText = target[0] || "名称なし";
                    document.getElementById('disp-desc').innerText = target[4] || "説明はありません。";
                    document.getElementById('disp-address').innerText = target[8] || "不明";
                    document.getElementById('disp-period').innerText = target[9] || "不明";
                    document.getElementById('disp-type').innerText = target[10] || "不明";
                    
                    // Googleマップ処理
                    const lat = target[2];
                    const lng = target[3];
                    const mapIframe = document.getElementById('disp-map');
                    if (lat && lng && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))) {
                        const coordinate = lat + "," + lng;
                        mapIframe.src = `https://www.google.com/maps?output=embed&q=${encodeURIComponent(coordinate)}&z=17`;
                        mapIframe.style.display = 'block';
                    } else {
                        mapIframe.style.display = 'none';
                    }

                    // 写真表示処理
                    const photoUrl = target[5];
                    const imgElement = document.getElementById('display-photo');
                    if (photoUrl && photoUrl.startsWith('http')) {
                        imgElement.src = photoUrl;
                        imgElement.style.display = 'block';
                    } else {
                        imgElement.style.display = 'none';
                    }
                    
                    document.title = (target[0] || "スポット詳細") + " - ザリマップ";

                    // 読み込み完了後に画面切り替え
                    loadingElem.style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    // IDが見つからない場合、画面上に理由を表示
                    loadingElem.innerHTML = `
                        <p style="color:red; font-weight:bold;">データ（ID: ${targetId}）が見つかりません。</p>
                        <p style="font-size:0.9rem;">現在取得できている有効データ件数は <b>${data.length}件</b> です。<br>指定できるIDの範囲は <b>0 〜 ${data.length - 1}</b> になります。</p>
                    `;
                }
            })
            .catch(err => {
                loadingElem.innerHTML = `<p style="color:red;">エラー発生: ${err.message}</p>`;
            });
    </script>
